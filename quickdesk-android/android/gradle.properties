org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental caches use paths relative to the Android project dir. When the
# pub cache lives on a different Windows drive (C:) than the project (D:), closing
# those caches fails with "this and base files have different roots" and breaks
# compileDebugKotlin for every plugin. Disable incremental compilation until the
# pub cache and the project are on the same drive.
kotlin.incremental=false
